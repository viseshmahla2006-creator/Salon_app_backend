<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For You ❤️ — 10 Seconds</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:#14051a; color:#fff; min-height:100vh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:22px;
  }
  .heart-bg { position:fixed; top:-30px; font-size:22px; opacity:0; animation:fall linear forwards; pointer-events:none; z-index:0; }
  @keyframes fall {
    0% { transform:translateY(-30px) rotate(0deg); opacity:0; }
    10% { opacity:.6; }
    100% { transform:translateY(110vh) rotate(340deg); opacity:0; }
  }
  .card {
    position:relative; z-index:2; max-width:480px; width:100%;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,120,170,.25);
    border-radius:28px; padding:36px 26px 30px;
    backdrop-filter:blur(14px);
    box-shadow:0 0 60px rgba(255,60,120,.18), inset 0 0 40px rgba(255,255,255,.03);
    animation:cardIn .9s ease both;
  }
  @keyframes cardIn { from { transform:scale(.85) translateY(30px); opacity:0; } to { transform:scale(1) translateY(0); opacity:1; } }
  h1 { font-size:30px; line-height:1.25; font-weight:700; }
  h1 span { color:#ff5c8a; }
  p.sub { color:#d8c8e0; font-size:16px; line-height:1.5; margin-top:12px; }
  .big-heart {
    font-size:110px; line-height:1; margin:22px 0 6px; cursor:pointer; user-select:none;
    animation:beat 1.1s ease-in-out infinite; display:inline-block;
    filter:drop-shadow(0 0 24px rgba(255,60,120,.55));
  }
  @keyframes beat { 0%,100% { transform:scale(1); } 25% { transform:scale(1.12); } 45% { transform:scale(1); } 60% { transform:scale(1.08); } }
  .tap-hint { color:#ff8fb0; font-size:15px; margin-bottom:6px; }
  .line { opacity:0; transform:translateY(14px); transition:all .6s ease; font-size:19px; line-height:1.45; margin-top:14px; }
  .line.show { opacity:1; transform:translateY(0); }
  .line.big { font-size:34px; font-weight:800; color:#ff5c8a; }
  .line.soft { color:#d8c8e0; font-size:16px; }
  .hidden { display:none; }
  button.hugback {
    margin-top:22px; border:none; cursor:pointer; font-size:17px; font-weight:700;
    color:#fff; background:linear-gradient(135deg,#ff5c8a,#a855f7);
    padding:15px 26px; border-radius:999px; box-shadow:0 8px 30px rgba(255,60,120,.4);
  }
  button.hugback:active { transform:scale(.96); }
  .count { margin-top:14px; font-size:17px; color:#ffb3c8; min-height:24px; }
  .sig { margin-top:20px; color:#9d8aa8; font-size:14px; }
  .burst { position:fixed; z-index:5; font-size:26px; pointer-events:none; animation:burstUp 1.1s ease-out forwards; }
  @keyframes burstUp {
    0% { transform:translate(0,0) scale(.6) rotate(0deg); opacity:1; }
    100% { transform:translate(var(--dx), -190px) scale(1.3) rotate(40deg); opacity:0; }
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div id="stage1">
    <h1>I know you're <span>busy…</span></h1>
    <p class="sub">So no long message. No "we need to talk".<br>This takes exactly 10 seconds.</p>
    <div class="big-heart" id="heart" role="button" aria-label="Tap the heart">❤️</div>
    <div class="tap-hint">Tap the heart 👆</div>
  </div>
  <div id="stage2" class="hidden">
    <div class="line" id="l1">No long paragraph.</div>
    <div class="line" id="l2">No drama. No pressure.</div>
    <div class="line" id="l3">Just this —</div>
    <div class="line big" id="l4">I miss you. ❤️</div>
    <div class="line soft" id="l5">That's it. Go back to work — I'll be right here.</div>
    <button class="hugback hidden" id="hugback">Tap if you miss me too 💕</button>
    <div class="count" id="count"></div>
    <div class="sig">— Visesh</div>
  </div>
</div>
<script>
  // floating hearts background
  function spawnBg() {
    const h = document.createElement('div');
    h.className = 'heart-bg';
    h.textContent = ['❤️','💕','💖','✨'][Math.floor(Math.random()*4)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.animationDuration = (5 + Math.random()*5) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 11000);
  }
  setInterval(spawnBg, 900); spawnBg();

  let hugs = 0, done = false;
  const heart = document.getElementById('heart');
  heart.addEventListener('click', () => {
    if (done) return; done = true;
    // heart burst
    for (let i = 0; i < 18; i++) {
      const b = document.createElement('div');
      b.className = 'burst';
      b.textContent = ['❤️','💕','💖'][i % 3];
      b.style.left = '50%'; b.style.top = '42%';
      b.style.setProperty('--dx', (Math.random()*220 - 110) + 'px');
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 1200);
    }
    document.getElementById('stage1').classList.add('hidden');
    const s2 = document.getElementById('stage2');
    s2.classList.remove('hidden');
    ['l1','l2','l3','l4','l5'].forEach((id, i) => {
      setTimeout(() => document.getElementById(id).classList.add('show'), 250 + i*450);
    });
    setTimeout(() => document.getElementById('hugback').classList.remove('hidden'), 250 + 5*450);
  });

  document.getElementById('hugback').addEventListener('click', () => {
    hugs++;
    const c = document.getElementById('count');
    c.textContent = hugs === 1 ? 'You miss me too ×1 ❤️' : 'You miss me too ×' + hugs + ' ❤️';
    // a little burst on every tap too
    const b = document.createElement('div');
    b.className = 'burst'; b.textContent = '💕';
    b.style.left = '50%'; b.style.top = '60%';
    b.style.setProperty('--dx', (Math.random()*120 - 60) + 'px');
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1200);
  });
</script>
</body>
</html>
